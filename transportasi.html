<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transportasi</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f3;
            color: #183b2a;
        }

        .app {
            max-width: 430px;
            min-height: 100vh;
            margin: auto;
            background: #f7f9f8;
        }

        .header {
            background: #174d35;
            color: white;
            padding: 30px 22px;
            border-radius: 0 0 28px 28px;
        }

        .back {
            font-size: 25px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .header h1 {
            font-size: 26px;
        }

        .header p {
            margin-top: 7px;
            font-size: 13px;
            opacity: 0.8;
        }

        .content {
            padding: 22px;
        }

        .bus-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        .bus-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .bus-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .bus-number {
            color: #777;
            font-size: 13px;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 18px;
        }

        .info-box {
            background: #edf7f0;
            padding: 14px;
            border-radius: 14px;
        }

        .info-box small {
            display: block;
            color: #777;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .info-box strong {
            font-size: 15px;
        }

        .section-title {
            font-size: 17px;
            font-weight: bold;
            margin: 25px 0 12px;
        }

        .member {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .member-name {
            font-weight: bold;
        }

        .member-role {
            color: #888;
            font-size: 11px;
            margin-top: 4px;
        }

        .seat {
            background: #e7f5eb;
            color: #287044;
            padding: 8px 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">

        <div class="back" onclick="history.back()">
            ←
        </div>

        <h1>Transportasi 🚌</h1>

        <p>
            Informasi perjalanan Family Gathering
        </p>

    </div>

    <div class="content">

       <div class="bus-card">

    <div class="bus-icon">
        🚌
    </div>

    <div class="bus-name">
        Bus Family Gathering
    </div>

    <div class="bus-number" id="busNumber">
        Bus Nomor -
    </div>

    <div class="info">

        <div class="info-box">
            <small>KEBERANGKATAN</small>
            <strong id="keberangkatan">-</strong>
        </div>

        <div class="info-box">
            <small>KAPASITAS</small>
            <strong>40 Kursi</strong>
        </div>

        <div class="info-box">
            <small>TITIK KUMPUL</small>
            <strong id="titikKumpul">-</strong>
        </div>

        <div class="info-box">
            <small>TUJUAN</small>
            <strong id="tujuan">-</strong>
        </div>

    </div>

</div>

     <div class="section-title">
    Anggota Keluarga
</div>

<div id="daftarKeluarga"></div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
async function loadTransportasi() {

    const nikLogin = localStorage.getItem("nikLogin");

    if (!nikLogin) {
        window.location.href = "login.html";
        return;
    }

    const { data, error } = await supabaseClient
        .rpc("ambil_peserta", {
            p_nik: nikLogin
        })
        .maybeSingle();

    if (error) {
        console.log(error);
        alert("Gagal mengambil data transportasi.");
        return;
    }

    if (!data) {
        localStorage.removeItem("nikLogin");
        window.location.href = "login.html";
        return;
    }

    document.getElementById("busNumber").textContent =
        data.transportasi.bus;

    document.getElementById("keberangkatan").textContent =
        data.transportasi.keberangkatan;

    document.getElementById("titikKumpul").textContent =
        data.transportasi.titikKumpul;

    document.getElementById("tujuan").textContent =
        data.transportasi.tujuan;
}
async function loadKeluargaTransportasi() {

    const nikLogin = localStorage.getItem("nikLogin");

    if (!nikLogin) {
        window.location.href = "login.html";
        return;
    }

    const { data, error } = await supabaseClient
        .rpc("ambil_peserta", {
            p_nik: nikLogin
        })
        .maybeSingle();

    if (error) {
        console.log(error);
        alert("Gagal mengambil data keluarga.");
        return;
    }

    if (!data) {
        localStorage.removeItem("nikLogin");
        window.location.href = "login.html";
        return;
    }

    const daftar = document.getElementById("daftarKeluarga");

    daftar.innerHTML = "";

    data.keluarga.forEach(function(anggota) {

        const member = document.createElement("div");

        member.className = "member";

        member.innerHTML = `
            <div>
                <div class="member-name">
                    ${anggota.nama}
                </div>

                <div class="member-role">
                    ${anggota.hubungan}
                </div>
            </div>

            <div class="seat">
                Kursi ${anggota.kursi}
            </div>
        `;

        daftar.appendChild(member);
    });
}
loadTransportasi();
loadKeluargaTransportasi();

</script>

</body>
</html>
