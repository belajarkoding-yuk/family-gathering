<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Peserta</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7faf8;
            color: #174d3a;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        .back {
            font-size: 28px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .nama {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .nik {
            color: #777;
            margin-bottom: 8px;
        }

        .jumlah {
            color: #777;
        }

        .loading {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: #14583f;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="back" onclick="window.location.href='admin-dashboard.html'">
        ←
    </div>

    <h1>Data Peserta 👨‍👩‍👧‍👦</h1>

    <div class="subtitle">
        Daftar peserta Family Gathering 2026
    </div>

    <button class="btn"
        onclick="window.location.href='tambah-peserta.html'">
    ➕ TAMBAH PESERTA
</button>
    <div id="daftarPeserta">
        <div class="loading">
            Memuat data peserta...
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

async function cekAdmin() {

    const { data, error } =
        await supabaseClient.auth.getSession();

    if (error || !data.session) {
        window.location.href = "admin.html";
        return false;
    }

    const userId = data.session.user.id;

    const { data: admin, error: adminError } =
        await supabaseClient
            .from("admin_users")
            .select("id, role")
            .eq("user_id", userId)
            .eq("role", "admin")
            .maybeSingle();

    if (adminError || !admin) {
        await supabaseClient.auth.signOut();
        window.location.href = "admin.html";
        return false;
    }

    return true;
}


async function loadPeserta() {

    const aman = await cekAdmin();

    if (!aman) {
        return;
    }

    const daftar =
        document.getElementById("daftarPeserta");

    const { data, error } =
    await supabaseClient
        .rpc("ambil_semua_peserta_admin");

    if (error) {

        console.log(error);

        daftar.innerHTML = `
            <div class="card">
                Gagal mengambil data peserta.
            </div>
        `;

        return;
    }

    daftar.innerHTML = "";

    if (!data || data.length === 0) {

        daftar.innerHTML = `
            <div class="card">
                Belum ada data peserta.
            </div>
        `;

        return;
    }

    data.forEach(function(peserta) {

        const jumlahKeluarga =
            Array.isArray(peserta.keluarga)
                ? peserta.keluarga.length
                : 0;

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="nama">
                ${peserta.nama}
            </div>

            <div class="nik">
                NIK: ${peserta.nik}
            </div>

           <div class="jumlah">
    👨‍👩‍👧‍👦 ${jumlahKeluarga} anggota keluarga
</div>

<button class="edit-btn"
    onclick="window.location.href='edit-peserta.html?nik=${peserta.nik}'">
    ✏️ EDIT PESERTA
</button>
<button class="delete-btn"
    onclick="hapusPeserta('${peserta.nik}')">
    🗑️ HAPUS PESERTA
</button>

        `;

        daftar.appendChild(card);
    });
}
async function hapusPeserta(nik) {

    const aman = await cekAdmin();

    if (!aman) {
        return;
    }

    const yakin = confirm(
        "Yakin ingin menghapus peserta dengan NIK " + nik + "?"
    );

    if (!yakin) {
        return;
    }

    const { error } =
        await supabaseClient
            .rpc("hapus_peserta_admin", {
                p_nik: nik
            });

    if (error) {

        console.log(error);

        alert("Gagal menghapus peserta.");

        return;
    }

    alert("Peserta berhasil dihapus.");

    loadPeserta();
}
loadPeserta();
</script>

</body>
</html>
