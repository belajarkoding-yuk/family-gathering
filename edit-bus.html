<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Edit Bus</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f3;
            color: #183b2a;
        }

        .app {
            max-width: 430px;
            min-height: 100vh;
            margin: auto;
            background: white;
            padding: 25px;
        }

        h1 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            border: none;
            background: #174d35;
            color: white;
            padding: 15px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
        }

        .back {
            background: #777;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="app">

    <button
        class="btn back"
        onclick="window.location.href='bus-admin.html'">
        ← KEMBALI
    </button>

    <h1>✏️ Edit Bus</h1>

    <label>Nama Bus</label>
    <input type="text" id="namaBus">

    <label>Jam</label>
    <input type="text" id="jam">

    <label>Titik Kumpul</label>
    <input type="text" id="titikKumpul">

    <label>Tujuan</label>
    <input type="text" id="tujuan">

    <label>Kapasitas Kursi</label>
    <input type="number" id="kapasitas">
<button class="btn" onclick="simpanPerubahan()">
    SIMPAN PERUBAHAN
</button>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>

const params = new URLSearchParams(window.location.search);

const idBus = params.get("id");


async function loadBus() {

    if (!idBus) {
        alert("ID bus tidak ditemukan.");
        return;
    }

    const { data, error } =
        await supabaseClient
            .from("bus")
            .select("*")
            .eq("id", idBus)
            .single();

    if (error) {

        console.log(error);

        alert("Gagal mengambil data bus.");

        return;
    }

    document.getElementById("namaBus").value =
        data.nama_bus || "";

    document.getElementById("jam").value =
        data.jam || "";

    document.getElementById("titikKumpul").value =
        data.titik_kumpul || "";

    document.getElementById("tujuan").value =
        data.tujuan || "";

    document.getElementById("kapasitas").value =
        data.kapasitas || "";

}

async function simpanPerubahan() {

    const namaBus =
        document.getElementById("namaBus").value.trim();

    const jam =
        document.getElementById("jam").value.trim();

    const titikKumpul =
        document.getElementById("titikKumpul").value.trim();

    const tujuan =
        document.getElementById("tujuan").value.trim();

    const kapasitas =
        document.getElementById("kapasitas").value;

    if (!namaBus || !jam || !titikKumpul || !tujuan || !kapasitas) {

        alert("Semua data bus harus diisi.");

        return;
    }

    const { error } =
        await supabaseClient
            .from("bus")
            .update({
                nama_bus: namaBus,
                jam: jam,
                titik_kumpul: titikKumpul,
                tujuan: tujuan,
                kapasitas: Number(kapasitas)
            })
            .eq("id", idBus);

    if (error) {

        console.log(error);

        alert("Gagal menyimpan perubahan.");

        return;
    }

    alert("Data bus berhasil diubah.");

    window.location.href = "bus-admin.html";
        }
loadBus();

</script>
</body>
</html>
