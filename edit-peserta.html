<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Edit Peserta</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7faf8;
            color: #174d3a;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        .back {
            font-size: 28px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: #14583f;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .member {
            padding: 15px;
            margin-top: 15px;
            background: #f7faf8;
            border-radius: 15px;
        }

        .member-title {
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="back"
        onclick="window.location.href='peserta-admin.html'">
        ←
    </div>

    <h1>Edit Peserta ✏️</h1>

    <div class="subtitle">
        Ubah data peserta Family Gathering 2026
    </div>

    <div class="card">

        <label>Nama Peserta</label>
        <input type="text" id="nama">

        <label>NIK</label>
        <input type="text" id="nik" readonly>

    </div>

    <div class="card">

        <h3>Anggota Keluarga</h3>

        <div id="daftarKeluarga"></div>

    </div>

    <button class="btn" onclick="simpanPerubahan()">
        💾 SIMPAN PERUBAHAN
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

async function cekAdmin() {

    const { data, error } =
        await supabaseClient.auth.getSession();

    if (error || !data.session) {

        window.location.href = "admin.html";

        return false;
    }

    const userId = data.session.user.id;

    const { data: admin, error: adminError } =
        await supabaseClient
            .from("admin_users")
            .select("id, role")
            .eq("user_id", userId)
            .eq("role", "admin")
            .maybeSingle();

    if (adminError || !admin) {

        await supabaseClient.auth.signOut();

        window.location.href = "admin.html";

        return false;
    }

    return true;
}


async function loadPeserta() {

    const aman = await cekAdmin();

    if (!aman) {
        return;
    }

    const params =
        new URLSearchParams(window.location.search);

    const nik =
        params.get("nik");

    if (!nik) {
        alert("NIK peserta tidak ditemukan.");
        window.location.href = "peserta-admin.html";
        return;
    }

    const { data, error } =
        await supabaseClient
            .rpc("ambil_peserta", {
                p_nik: nik
            })
            .maybeSingle();

    if (error || !data) {
        console.log(error);
        alert("Data peserta tidak ditemukan.");
        window.location.href = "peserta-admin.html";
        return;
    }

    document.getElementById("nama").value =
        data.nama;

    document.getElementById("nik").value =
        data.nik;

    const daftar =
        document.getElementById("daftarKeluarga");

    daftar.innerHTML = "";

    data.keluarga.forEach(function(anggota, index) {

        const member =
            document.createElement("div");

        member.className = "member";

        member.innerHTML = `

            <div class="member-title">
                Anggota ${index + 1}
            </div>

            <label>Nama</label>

            <input
                type="text"
                class="namaKeluarga"
                value="${anggota.nama}">

            <label>Hubungan</label>

            <input
                type="text"
                class="hubunganKeluarga"
                value="${anggota.hubungan}">

            <label>Ukuran Baju</label>

            <select class="ukuranKeluarga">

                <option value="">Pilih ukuran</option>

                <option ${anggota.ukuranBaju === "XS" ? "selected" : ""}>XS</option>
                <option ${anggota.ukuranBaju === "S" ? "selected" : ""}>S</option>
                <option ${anggota.ukuranBaju === "M" ? "selected" : ""}>M</option>
                <option ${anggota.ukuranBaju === "L" ? "selected" : ""}>L</option>
                <option ${anggota.ukuranBaju === "XL" ? "selected" : ""}>XL</option>
                <option ${anggota.ukuranBaju === "XXL" ? "selected" : ""}>XXL</option>
                <option ${anggota.ukuranBaju === "XXXL" ? "selected" : ""}>XXXL</option>

            </select>

            <label>Nomor Kursi</label>

            <input
                type="text"
                class="kursiKeluarga"
                value="${anggota.kursi}"
                maxlength="2">

        `;

        daftar.appendChild(member);
    });
}


async function simpanPerubahan() {

    const aman = await cekAdmin();

    if (!aman) {
        return;
    }

    const nik =
        document.getElementById("nik").value.trim();

    const nama =
        document.getElementById("nama").value.trim();

    if (nama === "") {
        alert("Nama peserta harus diisi.");
        return;
    }

    const namaKeluarga =
        document.querySelectorAll(".namaKeluarga");

    const hubunganKeluarga =
        document.querySelectorAll(".hubunganKeluarga");

    const ukuranKeluarga =
        document.querySelectorAll(".ukuranKeluarga");

    const kursiKeluarga =
        document.querySelectorAll(".kursiKeluarga");

    const keluarga = [];

    for (let i = 0; i < namaKeluarga.length; i++) {

        const namaAnggota =
            namaKeluarga[i].value.trim();

        const hubungan =
            hubunganKeluarga[i].value.trim();

        const ukuran =
            ukuranKeluarga[i].value;

        const kursi =
            kursiKeluarga[i].value.trim();

        if (
            namaAnggota === "" ||
            hubungan === "" ||
            ukuran === "" ||
            kursi === ""
        ) {
            alert(
                "Data anggota keluarga nomor " +
                (i + 1) +
                " belum lengkap."
            );
            return;
        }

        keluarga.push({
            nama: namaAnggota,
            hubungan: hubungan,
            ukuranBaju: ukuran,
            kursi: kursi.padStart(2, "0")
        });
    }

    const { error } =
        await supabaseClient
            .rpc("edit_peserta_admin", {
                p_nik: nik,
                p_nama: nama,
                p_keluarga: keluarga
            });

    if (error) {

        console.log(error);

        alert("Gagal menyimpan perubahan.");

        return;
    }

    alert("Perubahan peserta berhasil disimpan! 🎉");

    window.location.href = "peserta-admin.html";
}


loadPeserta();

</script>

</body>
</html>
