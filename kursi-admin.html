<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kelola Kursi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7faf8;
            color: #174d3a;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        .back {
            font-size: 28px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .nama {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .nik {
            color: #777;
            margin-bottom: 15px;
        }

        .keluarga {
            margin-top: 15px;
        }

        .anggota {
            padding: 12px;
            margin-top: 8px;
            background: #f7faf8;
            border-radius: 12px;
        }

        .loading {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        .kursi {
            font-weight: bold;
            color: #14583f;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="back"
        onclick="window.location.href='admin-dashboard.html'">
        ←
    </div>

    <h1>Kelola Kursi 🪑</h1>

    <div class="subtitle">
        Data tempat duduk peserta Family Gathering 2026
    </div>

    <div id="daftarKursi">
        <div class="loading">
            Memuat data kursi...
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

async function cekAdmin() {

    const { data, error } =
        await supabaseClient.auth.getSession();

    if (error || !data.session) {
        window.location.href = "admin.html";
        return false;
    }

    const userId = data.session.user.id;

    const { data: admin, error: adminError } =
        await supabaseClient
            .from("admin_users")
            .select("id, role")
            .eq("user_id", userId)
            .eq("role", "admin")
            .maybeSingle();

    if (adminError || !admin) {
        await supabaseClient.auth.signOut();
        window.location.href = "admin.html";
        return false;
    }

    return true;
}


async function loadKursi() {

    const aman = await cekAdmin();

    if (!aman) {
        return;
    }

    const daftar =
        document.getElementById("daftarKursi");

    const { data, error } =
        await supabaseClient
            .rpc("ambil_semua_peserta_admin");

    if (error) {

        console.log(error);

        daftar.innerHTML = `
            <div class="card">
                Gagal mengambil data kursi.
            </div>
        `;

        return;
    }

    daftar.innerHTML = "";

    if (!data || data.length === 0) {

        daftar.innerHTML = `
            <div class="card">
                Belum ada data peserta.
            </div>
        `;

        return;
    }

    data.forEach(function(peserta) {

        const card =
            document.createElement("div");

        card.className = "card";

        let isiKeluarga = "";

        if (Array.isArray(peserta.keluarga)) {

            peserta.keluarga.forEach(function(anggota) {

                isiKeluarga += `
                    <div class="anggota">

                        <strong>
                            ${anggota.nama || "-"}
                        </strong>

                        <br>

                        Hubungan:
                        ${anggota.hubungan || "-"}

                        <br>

                        🪑 Kursi:
                        <span class="kursi">
                            ${anggota.nomorKursi || anggota.kursi || "-"}
                        </span>

                    </div>
                `;
            });
        }

        card.innerHTML = `

            <div class="nama">
                ${peserta.nama}
            </div>

            <div class="nik">
                NIK: ${peserta.nik}
            </div>

            <div class="keluarga">

                <strong>
                    👨‍👩‍👧‍👦 Anggota Keluarga
                </strong>

                ${isiKeluarga || `
                    <div class="anggota">
                        Belum ada data kursi.
                    </div>
                `}

            </div>

        `;
        card.innerHTML += `
        <button
    onclick="window.location.href='edit-kursi.html?nik=${peserta.nik}'"
    style="
        width:100%;
        margin-top:15px;
        padding:14px;
        border:none;
        border-radius:14px;
        background:#14583f;
        color:white;
        font-size:16px;
        font-weight:bold;
    ">
    ✏️ EDIT KURSI
</button>
`;
        daftar.appendChild(card);
    });
}


loadKursi();

</script>

</body>
</html>
