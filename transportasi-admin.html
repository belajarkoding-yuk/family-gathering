<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kelola Transportasi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7faf8;
            color: #174d3a;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        .back {
            font-size: 28px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .nama {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .nik {
            color: #777;
            margin-bottom: 15px;
        }

        .transport {
            line-height: 1.8;
            color: #555;
        }

        .loading {
            text-align: center;
            color: #777;
            padding: 30px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="back"
        onclick="window.location.href='admin-dashboard.html'">
        ←
    </div>

    <h1>Kelola Transportasi 🚌</h1>

    <div class="subtitle">
        Data transportasi peserta Family Gathering 2026
    </div>

    <div id="daftarTransportasi">
        <div class="loading">
            Memuat data transportasi...
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

async function cekAdmin() {

    const { data, error } =
        await supabaseClient.auth.getSession();

    if (error || !data.session) {
        window.location.href = "admin.html";
        return false;
    }

    const userId = data.session.user.id;

    const { data: admin, error: adminError } =
        await supabaseClient
            .from("admin_users")
            .select("id, role")
            .eq("user_id", userId)
            .eq("role", "admin")
            .maybeSingle();

    if (adminError || !admin) {
        await supabaseClient.auth.signOut();
        window.location.href = "admin.html";
        return false;
    }

    return true;
}


async function loadTransportasi() {

    const aman = await cekAdmin();

    if (!aman) {
        return;
    }

    const daftar =
        document.getElementById("daftarTransportasi");

    const { data, error } =
        await supabaseClient
            .rpc("ambil_semua_peserta_admin");

    if (error) {

        console.log(error);

        daftar.innerHTML = `
            <div class="card">
                Gagal mengambil data transportasi.
            </div>
        `;

        return;
    }

    daftar.innerHTML = "";

    if (!data || data.length === 0) {

        daftar.innerHTML = `
            <div class="card">
                Belum ada data peserta.
            </div>
        `;

        return;
    }

    data.forEach(function(peserta) {

        const transportasi =
            peserta.transportasi || {};

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="nama">
                ${peserta.nama}
            </div>

            <div class="nik">
                NIK: ${peserta.nik}
            </div>

            <div class="transport">
                🚌 Bus:
                ${transportasi.bus || "-"}
                <br>

                🕐 Jam:
                ${transportasi.jam || "-"}
                <br>

                📍 Titik Kumpul:
                ${transportasi.titikKumpul || "-"}
                <br>

                🎯 Tujuan:
                ${transportasi.tujuan || "-"}
            </div>
<button
    onclick="window.location.href='edit-transportasi.html?nik=${peserta.nik}'"
    style="
        width:100%;
        margin-top:15px;
        padding:14px;
        border:none;
        border-radius:14px;
        background:#14583f;
        color:white;
        font-size:16px;
        font-weight:bold;
    ">
    ✏️ EDIT TRANSPORTASI
</button>
        `;

        daftar.appendChild(card);
    });
}


loadTransportasi();

</script>

</body>
</html>
