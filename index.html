<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Family Gathering</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f3;
            color: #183b2a;
        }

        .app {
            max-width: 430px;
            min-height: 100vh;
            margin: auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #174d35;
            color: white;
            padding: 60px 25px 35px;
            border-radius: 0 0 30px 30px;
        }

        .header small {
            opacity: 0.8;
        }

        .header h1 {
            margin-top: 8px;
            font-size: 32px;
        }

        .content {
            padding: 30px 25px;
            flex: 1;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #777;
            line-height: 1.5;
        }

        .location {
            background: #edf7f0;
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 30px;
        }

        .location strong {
            display: block;
            margin-bottom: 6px;
        }

        .location p {
            color: #666;
        }

        .btn {
            width: 100%;
            border: none;
            background: #174d35;
            color: white;
            padding: 16px;
            border-radius: 15px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="app">

        <div class="header">
            <small>EVENT KELUARGA</small>
            <h1>Family<br>Gathering</h1>
        </div>

        <div class="content">

            <div class="welcome">
                <h2>Selamat Datang 👋</h2>
                <p>
                    Mari bergabung dalam acara
                    Family Gathering bersama keluarga.
                </p>
            </div>

            <div class="location">
                <strong>📍 Lokasi Acara</strong>
                <p>The Jungle Waterpark Bogor</p>
            </div>

            <button class="btn" onclick="window.location.href='login.html'">
    👤 LOGIN PESERTA
</button>

<button class="btn" 
    onclick="window.location.href='admin.html'"
    style="margin-top:15px;">
    🔐 LOGIN ADMIN
</button>

        </div>

        <div class="footer">
            Family Gathering © 2026
        </div>

    </div>

</body>
</html>
